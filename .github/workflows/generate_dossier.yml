name: Generate QCI Institutional Dossier

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: 'Target Entity / Company Name'
        required: true
        default: 'Maruti Suzuki'
      stakeholder_type:
        description: 'Stakeholder Category'
        required: true
        type: choice
        options:
          - OEM
          - MSME
          - Trade Body/Association
          - DIC/DFO
          - Industrial Cluster
      sector:
        description: 'Industry Sector'
        required: true
        default: 'Automotive & Component Manufacturing'
      state:
        description: 'State / Industrial Region'
        required: true
        default: 'Haryana'

jobs:
  build-dossier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests google-generativeai

      - name: Run Intelligence Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TARGET_NAME: ${{ github.event.inputs.target_name }}
          STAKEHOLDER_TYPE: ${{ github.event.inputs.stakeholder_type }}
          SECTOR: ${{ github.event.inputs.sector }}
          STATE: ${{ github.event.inputs.state }}
        run: |
          python generate_dossier.py

      - name: Commit and Push Generated Dossier
        run: |
          git config --global user.name "QCI Intel Bot"
          git config --global user.email "bot@qci.org"
          git add dossier_*.md
          git commit -m "Auto-generated dossier for ${{ github.event.inputs.target_name }}" || echo "No changes to commit"
          git push
